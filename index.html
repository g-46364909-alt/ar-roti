<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR-BakeTech: Pemotong Doh</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    .ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 9999;
    }
    .btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .btn:active { background: #e68a00; }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- Butang Kawalan Interaktif Di Skrin Telefon -->
  <div class="ui-container">
    <button class="btn" onclick="playVideo()">▶ Main Video BIM</button>
    <button class="btn" onclick="pauseVideo()">⏸ Henti Video</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <!-- Pastikan nama fail ini sama dengan fail dalam folder anda -->
      <img id="img-scraper" src="scraper.png">
      <video id="video-scraper" src="bim_scraper.mp4" loop crossorigin webkit-playsinline playsinline></video>
    </a-assets>

    <!-- MARKER HIRO -->
    <a-marker preset="hiro">
      <!-- Tajuk Visual -->
      <a-text value="PEMOTONG DOH\n(Dough Scraper)" position="0 2.2 0" align="center" color="#FFD700" scale="1.2 1.2 1.2"></a-text>

      <!-- Paparan Gambar Scraper -->
      <a-image src="#img-scraper" position="-0.9 1 0" width="1.2" height="1.2" rotation="-90 0 0"></a-image>

      <!-- Skrin Video BIM -->
      <a-video src="#video-scraper" position="0.9 1 0" width="1.4" height="0.9" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const video = document.querySelector('#video-scraper');
    
    function playVideo() {
      video.play();
    }
    
    function pauseVideo() {
      video.pause();
    }
  </script>

</body>
</html>
